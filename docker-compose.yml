services:
  mysql:
    image: mysql:8.4
    container_name: notbad-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notbad}
      MYSQL_USER: ${MYSQL_USER:-notbad}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-notbad_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-notbad_root_local}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - notbad-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  notbad-mysql-data:
